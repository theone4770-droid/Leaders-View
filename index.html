    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('lv_theme_v1') || '"dark"');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
          var m = JSON.parse(localStorage.getItem('lv_selected_market_v1') || '"XAUUSD"');
          m = m === 'BTCUSD' ? 'BTCUSD' : 'XAUUSD';
          var tf = JSON.parse(localStorage.getItem('lv_timeframe_v1_' + m) || '"15m"') || '15m';
          var url = '/api/klines?market=' + encodeURIComponent(m) + '&interval=' + encodeURIComponent(tf) + '&limit=400';
          var entry = { url: url, resolved: null, promise: null };
          entry.promise = fetch(url)
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) { entry.resolved = data; return data; })
            .catch(function () { return null; });
          window.__LV_INITIAL_KLINES__ = entry;

          var tickersEntry = { resolved: null, promise: null };
          tickersEntry.promise = fetch('/api/tickers')
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) { tickersEntry.resolved = data; return data; })
            .catch(function () { return null; });
          window.__LV_INITIAL_TICKERS__ = tickersEntry;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#080808] text-[#F5F5F7] antialiased selection:bg-[#D4AF37]/30 selection:text-[#F0D278] overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
